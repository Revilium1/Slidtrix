<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Slidtrix</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
      user-select: none;
      background: black;
    }
    h2 {
    color : #0f0;
    }
    #grid {
      color: #0f0;
      display: grid;
      grid-template-columns: repeat(10, 40px);
      grid-template-rows: repeat(10, 40px);
      gap: 2px;
      margin-bottom: 20px;
    }
    .tile {
      color: #0f0;
      width: 40px;
      height: 40px;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background-color: #000;
    }
    #controls {
      margin-bottom: 10px;
    }
    #library-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 0 0 10px;
    }
    #library-controls button {
      padding: 8px 12px;
      color: #0f0;
      background: #111;
      border: 1px solid #0f0;
      cursor: pointer;
    }
    #level-meta {
      color: #aaa;
      margin: 0 0 8px;
    }
    label {
      margin-right: 8px;
    }

    #status {
      color: #0f0;
    }
    #game-stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
      margin: 0 0 12px;
      color: #0f0;
    }
    #game-stats[hidden] {
      display: none;
    }
    #game-stats strong {
      color: #fff;
      font-variant-numeric: tabular-nums;
    }
    #pause-game {
      padding: 6px 10px;
      color: #0f0;
      background: #111;
      border: 1px solid #0f0;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>SLIDTRIX</h2>
  <div id="library-controls" aria-label="Level library controls">
    <button id="open-library" type="button">Level Library</button>
    <button id="import-level" type="button">Import Level Code</button>
    <button id="save-to-library" type="button">Save to Library</button>
  </div>
  <p id="level-meta"></p>
  <p id="status"></p>
  <div id="game-stats" aria-label="Game statistics" hidden>
    <span>Moves: <strong id="moves-count">0</strong></span>
    <span>Timer: <strong id="timer-count">00:00</strong></span>
    <span>Ticks: <strong id="ticks-count">0</strong></span>
    <button id="pause-game" type="button" hidden>Pause</button>
  </div>
  <div id="grid"></div>

<script src="scriptrix.js"></script>
</body>
</html>
